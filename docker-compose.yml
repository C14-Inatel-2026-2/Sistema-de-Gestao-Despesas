# ---------------------------------------------------------------------------
# Sobe a aplicacao completa em containers.
#
#   docker compose up --build      # sobe tudo
#   docker compose down            # derruba
#
# Para o desenvolvimento do dia a dia no frontend, prefira `pnpm dev` direto na
# maquina: o hot reload e bem mais rapido do que atraves de bind mount.
# Este compose serve para validar a imagem de producao, rodar a stack inteira
# de uma vez e dar suporte a CI.
# ---------------------------------------------------------------------------

services:
  frontend:
    build:
      context: ./frontend
      target: runner
    ports:
      - "3000:3000"
    environment:
      # Dentro da rede do compose, o backend responde pelo nome do servico.
      NEXT_PUBLIC_API_URL: http://backend:8000
    restart: unless-stopped

